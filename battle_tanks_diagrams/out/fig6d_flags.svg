<text x="950.0" y="36.0" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#000" text-anchor="middle">Fig 6d - Collision Engine (3/3): Sticky Hit Registers (write-1-to-clear) and CPU Read Path</text>
<text x="950.0" y="60.0" font-family="DejaVu Sans" font-size="14" font-weight="normal" fill="#444" text-anchor="middle">Hits are latched until the CPU clears them, so a hit lasting less than one software frame is never missed.  Registers 0x20..0x2C, word access.</text>
<text x="192.7" y="204.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">set_i  (wall_set / bb_hit / btk_hit / tank_set)</text>
<text x="875.0" y="210.0" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">bit_q</text>
<path d="M820,218 L831,229 L820,240" fill="none" stroke="#000" stroke-width="1.5"/>
<circle cx="970.0" cy="215.0" r="3.8" fill="#111111"/>
<text x="705.0" y="129.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">hold (sticky)</text>
<text x="1136.9" y="219.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#1f6fe0" text-anchor="middle">bit_q  (-&gt; read path, Part B)</text>
<text x="105.9" y="284.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">wr_en_col  (Fig 2a)</text>
<text x="118.3" y="334.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#000" text-anchor="middle">d_addr[3:2] == this reg</text>
<text x="84.2" y="384.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#000" text-anchor="middle">d_wdata[bit]</text>
<text x="523.0" y="314.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">clr_i</text>
<text x="1100.0" y="250.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Priority: clear wins over set when both occur in the same clock</text>
<text x="1100.0" y="264.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">(ANDing ~clr after the OR) - a persistent hit is simply re-set next clock.</text>
<text x="1100.0" y="278.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start"></text>
<text x="1100.0" y="292.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">The CPU clears by writing 1s:   sw  mask, 0x8000_0024 (etc.)</text>
<text x="1100.0" y="306.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Writing 0s changes nothing, so a read-modify-write is never needed.</text>
<text x="1105.0" y="645.2" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#333" text-anchor="start">0</text>
<text x="1105.0" y="727.8" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#333" text-anchor="start">1</text>
<text x="1105.0" y="810.2" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#333" text-anchor="start">2</text>
<text x="1105.0" y="892.8" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#333" text-anchor="start">3</text>
<text x="1123.0" y="944.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">d_addr[3:2]</text>
<text x="370.0" y="600.0" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">0x20 COLLISION_FLAG</text>
<text x="370.0" y="613.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">{29'b0, tank_hit_any, bb_any, wall_any}</text>
<text x="370.0" y="626.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">bit0 = any wall hit    bit1 = any bullet-bullet    bit2 = any bullet-tank</text>
<line x1="751.0" y1="631.0" x2="759.0" y2="619.0" stroke="#1f6fe0" stroke-width="1.8"/>
<text x="755.0" y="614.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#1f6fe0" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<text x="370.0" y="760.0" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">0x24 WALL_MASK</text>
<text x="370.0" y="773.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">{24'b0, wall_q[7:0]}</text>
<text x="370.0" y="786.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">bit i = bullet i touched a wall since last clear</text>
<line x1="761.0" y1="791.0" x2="769.0" y2="779.0" stroke="#1f6fe0" stroke-width="1.8"/>
<text x="765.0" y="774.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#1f6fe0" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<text x="370.0" y="920.0" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">0x28 BB_MASK</text>
<text x="370.0" y="933.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">{24'b0, bb_q[7:0]}</text>
<text x="370.0" y="946.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">bit i = bullet i hit another bullet (both bits set -&gt; cancel pair)</text>
<line x1="771.0" y1="951.0" x2="779.0" y2="939.0" stroke="#1f6fe0" stroke-width="1.8"/>
<text x="775.0" y="934.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#1f6fe0" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<text x="370.0" y="1080.0" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">0x2C HIT_MASK</text>
<text x="370.0" y="1093.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">{22'b0, tank_q[1:0], btk_q[7:0]}</text>
<text x="370.0" y="1106.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">[7:0] which bullet hit a tank    [9:8] which tank was hit (bit8=P1, bit9=P2)</text>
<line x1="781.0" y1="1111.0" x2="789.0" y2="1099.0" stroke="#1f6fe0" stroke-width="1.8"/>
<text x="785.0" y="1094.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#1f6fe0" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<text x="60.0" y="560.0" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="#000" text-anchor="start">0x20 bits come from three 8-input OR reductions of the sticky registers:</text>
<text x="127.7" y="1239.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#a35c00" text-anchor="middle">wall_q[7:0]</text>
<line x1="168.9" y1="1241.0" x2="176.9" y2="1229.0" stroke="#f08c00" stroke-width="1.8"/>
<text x="172.9" y="1226.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#f08c00" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[8]</text>
<text x="284.7" y="1239.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#2e9d3a" text-anchor="middle">wall_any</text>
<text x="452.1" y="1239.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#a35c00" text-anchor="middle">bb_q[7:0]</text>
<line x1="487.7" y1="1241.0" x2="495.7" y2="1229.0" stroke="#f08c00" stroke-width="1.8"/>
<text x="491.7" y="1226.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#f08c00" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[8]</text>
<text x="598.0" y="1239.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#2e9d3a" text-anchor="middle">bb_any</text>
<text x="784.9" y="1239.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#a35c00" text-anchor="middle">btk_q[7:0]</text>
<line x1="823.3" y1="1241.0" x2="831.3" y2="1229.0" stroke="#f08c00" stroke-width="1.8"/>
<text x="827.3" y="1226.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#f08c00" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[8]</text>
<text x="950.3" y="1239.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#2e9d3a" text-anchor="middle">tank_hit_any</text>
<text x="60.0" y="1280.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#333" text-anchor="start">wall_any -&gt; bit0,  bb_any -&gt; bit1,  tank_hit_any -&gt; bit2 of COLLISION_FLAG (0x20)</text>
<text x="1347.9" y="769.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#1f6fe0" text-anchor="middle">rd_col[31:0]</text>
<line x1="1219.0" y1="771.0" x2="1227.0" y2="759.0" stroke="#1f6fe0" stroke-width="1.8"/>
<text x="1223.0" y="756.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#1f6fe0" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<text x="1430.0" y="769.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">-&gt; Fig 2b (gated by cs_col_q)</text>
<text x="1000.0" y="1000.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">How software uses it (per frame):</text>
<text x="1000.0" y="1014.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">1. flags = COLLISION_FLAG;  if (flags == 0) skip everything.</text>
<text x="1000.0" y="1028.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">2. m = HIT_MASK;  bullet index i = lowest set bit of m[7:0];</text>
<text x="1000.0" y="1042.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">   big = BULLET_REG_i.big  -&gt;  damage 5 or 1 to the tank in m[9:8].</text>
<text x="1000.0" y="1056.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">3. bb = BB_MASK; deactivate every set bullet (both sides of a pair cancel).</text>
<text x="1000.0" y="1070.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">4. w = WALL_MASK; reflect those bullets (vx or vy sign flip) in C.</text>
