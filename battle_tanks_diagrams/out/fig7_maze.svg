<text x="60.0" y="400.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Port A (CPU):  write with sw to 0x8000_0100 + 4*(20*row+col), read with lw.</text>
<text x="60.0" y="414.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Port B (read-only): one reader per copy -&gt; no arbitration, no stalls.</text>
<text x="60.0" y="428.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Copy C only needs reading; port A on both copies is write-enabled by the same we_cpu.</text>
<text x="60.0" y="442.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Tile code: 0 floor  1 wall  2 breakable  3 unused.</text>
<text x="60.0" y="456.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Software loads the maze once per round: 400 stores.</text>
