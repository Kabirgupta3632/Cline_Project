<text x="950.0" y="36.0" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#000" text-anchor="middle">Fig 7 - Maze Tile RAM: Two Mirrored True-Dual-Port BRAMs (20 x 20 tiles, 2 bits each)</text>
<text x="950.0" y="60.0" font-family="DejaVu Sans" font-size="14" font-weight="normal" fill="#444" text-anchor="middle">FPGA BRAM has only 2 ports, but 3 users need it (CPU, VGA, collision).  Fix: two identical RAMs; the CPU writes BOTH with the same data, VGA reads copy V on port B, collision reads copy C on port B, CPU reads back copy V on port A (copy C port A is write-only).</text>
