<text x="1000.0" y="760.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Why the select is registered:</text>
<text x="1000.0" y="774.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">BRAM / peripheral rdata appears one clock after the</text>
<text x="1000.0" y="788.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">address.  cs_x_q is cs_x delayed by one clk, so the</text>
<text x="1000.0" y="802.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">read mux lines up with the data (same as the core's</text>
<text x="1000.0" y="816.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">wb_read_data timing).  Sprite/HUD regs are write-only</text>
<text x="1000.0" y="830.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">and return 0 (not in the mux).</text>
</svg>