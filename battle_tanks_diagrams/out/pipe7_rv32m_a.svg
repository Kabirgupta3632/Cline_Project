<text x="1000.0" y="36.0" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#000" text-anchor="middle">Fig P7a - RV32M (1/2): multiplier unit (MUL / MULH / MULHSU / MULHU)</text>
<text x="1000.0" y="60.0" font-family="DejaVu Sans" font-size="14" font-weight="normal" fill="#444" text-anchor="middle">One 33 x 33 signed multiplier covers all four variants: bit 32 of each operand = operand[31] AND 'operand is signed'.  Maps onto DSP48 slices.</text>
<text x="74.9" y="174.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">funct3[1]</text>
<text x="74.9" y="274.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">funct3[0]</text>
<circle cx="160.0" cy="170.0" r="3.8" fill="#2e9d3a"/>
<text x="489.0" y="174.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">signedB = ~funct3[1]</text>
<text x="532.4" y="264.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">signedA = ~(funct3[1] &amp; funct3[0])</text>
<text x="40.0" y="350.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">funct3:  000 MUL   001 MULH (signed x signed)   010 MULHSU (signed x unsigned)   011 MULHU (unsigned x unsigned)</text>
<text x="40.0" y="375.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#555" text-anchor="start">MUL returns the low 32 bits, identical for signed and unsigned, so its sign choice is irrelevant.</text>
<text x="40.0" y="400.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#555" text-anchor="start">signedA = 0 only for MULHU;   signedB = 0 for MULHSU and MULHU.</text>
<text x="1070.0" y="580.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#000" text-anchor="middle">33 x 33 signed multiplier</text>
<text x="1070.0" y="594.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">product = A33 * B33  (66 bits)</text>
<text x="1070.0" y="607.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#444" text-anchor="middle" font-style="italic">1 clk (DSP48) or 2-clk pipelined</text>
<text x="906.0" y="694.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="start">A33[32:0]</text>
<text x="906.0" y="882.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="start">B33[32:0]</text>
<text x="1234.0" y="788.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="end">product[65:0]</text>
