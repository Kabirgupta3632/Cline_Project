<text x="1000.0" y="36.0" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#000" text-anchor="middle">Fig P7c - RV32M integration: result select into the ALU and pipeline stall / bubble control</text>
<text x="1000.0" y="60.0" font-family="DejaVu Sans" font-size="14" font-weight="normal" fill="#444" text-anchor="middle">The M unit sits in EX beside the ALU.  Its result enters input 4 of the ALU result mux (Fig P3); a DIV/REM holds the pipeline until done.</text>
<text x="130.7" y="174.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="middle">mul_result[31:0]  (Fig P7a)</text>
<text x="130.7" y="254.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="middle">div_result[31:0]  (Fig P7b)</text>
<text x="465.0" y="186.5" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#333" text-anchor="start">0 MUL*</text>
<text x="465.0" y="251.5" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#333" text-anchor="start">1 DIV/REM</text>
<line x1="286.7" y1="176.0" x2="294.7" y2="164.0" stroke="#111111" stroke-width="1.8"/>
<text x="290.7" y="161.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<line x1="296.7" y1="256.0" x2="304.7" y2="244.0" stroke="#111111" stroke-width="1.8"/>
<text x="300.7" y="241.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<text x="485.0" y="324.9" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#2e9d3a" text-anchor="middle">funct3[2]  (1 = DIV/REM)</text>
<text x="750.4" y="219.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="middle">m_result[31:0]</text>
<line x1="601.0" y1="221.0" x2="609.0" y2="209.0" stroke="#111111" stroke-width="1.8"/>
<text x="605.0" y="206.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">[32]</text>
<text x="900.0" y="200.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">m_result -&gt; input 4 of the 8:1 ALU result mux (Fig P3).</text>
<text x="900.0" y="214.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">ALU select = 3'b100 when m_ext = 1.</text>
<text x="40.0" y="400.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#555" text-anchor="start">funct3 map:  000 MUL  001 MULH  010 MULHSU  011 MULHU   |   100 DIV  101 DIVU  110 REM  111 REMU</text>
<text x="124.5" y="604.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="middle">pipeline_stall  (Fig P7b)</text>
<circle cx="300.0" cy="600.0" r="3.8" fill="#2e9d3a"/>
<text x="582.8" y="664.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">PC hold mux select</text>
<text x="659.6" y="664.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#555" text-anchor="start">-&gt; Fig P1 (stall_read_i OR pipeline_stall)</text>
<text x="632.4" y="744.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">IF/ID hold  (instruction register)</text>
<text x="758.8" y="744.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#555" text-anchor="start">-&gt; Fig P1/P2 hold muxes</text>
<text x="558.0" y="824.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">ID/EX hold</text>
<text x="610.0" y="824.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#555" text-anchor="start">-&gt; Fig P2 pipeline register: keeps the DIV in EX</text>
<circle cx="300.0" cy="660.0" r="3.8" fill="#2e9d3a"/>
<circle cx="300.0" cy="740.0" r="3.8" fill="#2e9d3a"/>
<text x="552.1" y="894.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#2e9d3a" text-anchor="middle">reg_write</text>
<text x="510.0" y="938.0" font-family="DejaVu Sans" font-size="9" font-weight="normal" fill="#c0392b" text-anchor="middle">pipeline_stall</text>
<text x="1072.7" y="924.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#2e9d3a" text-anchor="middle">reg_write_to_WB  (0 while stalled = NOP bubble)</text>
<text x="40.0" y="990.0" font-family="DejaVu Sans" font-size="10" font-weight="normal" fill="#555" text-anchor="start">While the divider runs, the DIV stays in EX and the instruction behind it is held in ID: WB sees a bubble (writes disabled) so nothing wrong is committed.</text>
</svg>