<text x="1230.0" y="400.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Tank operand: x,y from P1/P2_TANK_POS, w = h = 20 (constant), act = 1.</text>
<text x="1230.0" y="414.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Bullet operand: x,y,act,big from BULLET_REG_n; w = h from the mux above.</text>
<text x="1230.0" y="428.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start"></text>
<text x="1230.0" y="442.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">Why a tiny 5-bit adder per side:  A.x + A.w only needs 10-bit + 5-bit,</text>
<text x="1230.0" y="456.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">so the whole cell is 4 small adders + 4 comparators + 5 AND gates (~60 LUTs).</text>
<text x="1230.0" y="470.0" font-family="DejaVu Sans" font-size="11" font-weight="normal" fill="#333" text-anchor="start">All 44 cells evaluate in parallel in one clock.</text>
